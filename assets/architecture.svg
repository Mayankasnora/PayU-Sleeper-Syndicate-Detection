  <text x="20" y="176" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">Shared IMEI &amp; Payout Sinks</text>
  <text x="20" y="192" fill="#64748B" font-family="system-ui, sans-serif" font-size="8">Corporate Chain Safe-List</text>

  <!-- Dimensions -->
  <g transform="translate(12, 220)">
    <text x="0" y="14" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">• Feature Space</text>
    <text x="0" y="32" fill="#00F5D4" font-family="system-ui, sans-serif" font-size="12" font-weight="800">55 Engineered Vectors</text>
    <text x="0" y="52" fill="#64748B" font-family="system-ui, sans-serif" font-size="8">Redis Query &lt;4.5ms</text>
  </g>
</g>

