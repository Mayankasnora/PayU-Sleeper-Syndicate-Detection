    <text x="0" y="32" fill="#64748B" font-family="system-ui, sans-serif" font-size="8">  Tracks deposits + T+1 drains</text>
    <text x="0" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">• Ingestion Latency</text>
    <text x="0" y="68" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">&lt; 2ms Ingestion SLA</text>
  </g>
</g>

