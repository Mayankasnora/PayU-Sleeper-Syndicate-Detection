<svg width="100%" viewBox="0 0 960 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>PayU Fraud Detection Pipeline Architecture</title>
<defs>
  <style>
    @keyframes dashFlow {
      to { stroke-dashoffset: -32; }
    }
    @keyframes pulseCard {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.3; }
    }

    .flow-line {
      stroke-dasharray: 6 4;
      animation: dashFlow 1.2s linear infinite;
      fill: none;
    }
    .flow-line-reverse {
      stroke-dasharray: 6 4;
      animation: dashFlow 2s linear infinite;
      animation-direction: reverse;
      fill: none;
    }
    .card-border-glow {
      animation: pulseCard 3s ease-in-out infinite;
    }
    .node-dot {
      animation: nodeBlink 2s ease-in-out infinite;
    }
  </style>

  <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020813"/>
    <stop offset="100%" stop-color="#07192F"/>
  </linearGradient>

  <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0B1E33"/>
    <stop offset="100%" stop-color="#061322"/>
  </linearGradient>

  <linearGradient id="champGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#142C44"/>
    <stop offset="100%" stop-color="#0A1828"/>
  </linearGradient>

  <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00F5D4"/>
    <stop offset="100%" stop-color="#C2E200"/>
  </linearGradient>
</defs>

<!-- Outer Container -->
<rect width="960" height="480" rx="16" fill="url(#archBg)" stroke="#1E293B" stroke-width="1.5"/>

<!-- Grid Background Overlay -->
<g opacity="0.05" stroke="#00F5D4" stroke-width="0.8">
  <line x1="0" y1="60" x2="960" y2="60"/>
  <line x1="0" y1="120" x2="960" y2="120"/>
  <line x1="0" y1="180" x2="960" y2="180"/>
  <line x1="0" y1="240" x2="960" y2="240"/>
  <line x1="0" y1="300" x2="960" y2="300"/>
  <line x1="0" y1="360" x2="960" y2="360"/>
  <line x1="0" y1="420" x2="960" y2="420"/>
</g>

<!-- Header Title inside Architecture SVG -->
<g transform="translate(35, 40)">
  <rect width="180" height="20" rx="10" fill="#062238" stroke="#1E4564" stroke-width="1"/>
  <circle cx="10" cy="10" r="3.5" fill="#00F5D4" class="node-dot"/>
  <text x="22" y="13.5" fill="#00F5D4" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="0.8">END-TO-END PIPELINE</text>
  <text x="195" y="15" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800">
    Production Gateway Scoring, Settlement Gate &amp; Active Loop
  </text>
</g>

<!-- ======================================================== -->
<!-- PIPELINE STAGES (5 COLUMNS)                              -->
<!-- ======================================================== -->

<!-- STAGE 01: INGESTION -->
