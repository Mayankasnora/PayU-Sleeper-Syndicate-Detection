  <text x="34" y="147" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Kafka Bus Buffer</text>
  <text x="20" y="163" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">2,500+ Peak Match TPS</text>
  <text x="20" y="176" fill="#64748B" font-family="system-ui, sans-serif" font-size="8">Zero Droppage Resilience</text>

